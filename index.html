<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anshul Bird</title>
<style>
  :root{
    --sky-top:#7ec8e3;
    --sky-bottom:#bce8f1;
  }
  html,body{
    margin:0;padding:0;height:100%;
    background:#111;
    display:flex;align-items:center;justify-content:center;
    font-family:'Trebuchet MS',Arial,sans-serif;
    overflow:hidden;
  }
  #wrap{
    position:relative;
    width:400px;height:600px;
    max-width:100vw;max-height:100vh;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    border-radius:8px;
    overflow:hidden;
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
  }
  canvas{
    display:block;
    width:100%;height:100%;
    background:linear-gradient(var(--sky-top),var(--sky-bottom));
  }
  #titleCard{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,0.6);
    pointer-events:none;
  }
  #titleCard h1{
    font-size:2.4em;margin:0 0 6px 0;
    letter-spacing:1px;
  }
  #titleCard p{
    margin:4px 0;font-size:1em;opacity:0.9;
  }
  #hud{
    position:absolute;top:14px;left:0;right:0;
    text-align:center;
    font-size:2.4em;font-weight:bold;
    color:#fff;
    -webkit-text-stroke:2px #444;
    text-shadow:2px 2px 3px rgba(0,0,0,0.4);
    pointer-events:none;
  }
  #gameOverCard{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.45);
    color:#fff;
    text-align:center;
  }
  #gameOverCard h2{
    font-size:2em;margin:0 0 4px 0;
    color:#ff5e5e;
    text-shadow:2px 2px 4px rgba(0,0,0,0.7);
  }
  #gameOverCard .score{
    font-size:1.4em;margin:6px 0;
  }
  #gameOverCard button{
    margin-top:14px;
    padding:10px 26px;
    font-size:1.1em;
    border:none;border-radius:24px;
    background:#ffcc33;
    color:#5a3b00;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 0 #b98a00;
  }
  #gameOverCard button:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 #b98a00;
  }
  #hint{
    position:absolute;bottom:16px;left:0;right:0;
    text-align:center;color:#fff;font-size:0.85em;
    opacity:0.85;text-shadow:1px 1px 2px rgba(0,0,0,0.6);
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="400" height="600"></canvas>

  <div id="hud">0</div>

  <div id="titleCard">
    <h1>Anshul Bird</h1>
    <p>Tap / Click / Space to fly</p>
    <p>Don't touch the poles!</p>
  </div>

  <div id="gameOverCard">
    <h2>You Died!</h2>
    <div class="score">Score: <span id="finalScore">0</span></div>
    <div class="score">Best: <span id="bestScore">0</span></div>
    <button id="restartBtn">Restart</button>
  </div>

  <div id="hint">tap anywhere to start</div>
</div>
